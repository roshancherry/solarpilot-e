name: Solar Pilot Bridge
version: 0.1.0
slug: solar_pilot_bridge
description: Connects Home Assistant to your Solar Pilot mode queue. Runs only the scripts you map here.
url: https://github.com/roshancherry/solarpilot-e
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:transmission-tower
panel_title: Solar Pilot
options:
  server: "https://solar-pilot-cherri.pages.dev"
  customer: ""
  connection_key: ""
  poll_interval_seconds: 10
  completion_timeout_seconds: 120
  mode_scripts:
    good-night: ""
    away: ""
schema:
  server: str
  customer: str
  connection_key: password
  poll_interval_seconds: int(5,300)
  completion_timeout_seconds: int(10,600)
  mode_scripts:
    good-night: str?
    away: str?
